<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lost love</title>
<style>
  :root {
    --bg: #ffffff; --bubble: #f1f1f4; --text: #111111; --muted: #6b6b75;
    --accent: #7c4dff; --user-bubble: #e9e2ff; --border: #e6e6ea;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141414; --bubble: #1f1f1f; --text: #f2f2f2; --muted: #8a8a8a;
      --accent: #7c4dff; --user-bubble: #2b2140; --border: #222222;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 440px; height: 100%;
    display: flex; flex-direction: column;
    border-inline: 1px solid var(--border);
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  header .title { font-weight: 600; font-size: 17px; flex: 1; }
  header button {
    background: none; border: 0; color: var(--text);
    font-size: 20px; width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
  }
  button:focus-visible, .input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .pill { background: var(--bubble); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
  .messages {
    flex: 1; overflow-y: auto; padding: 16px 12px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .notice { text-align: center; color: var(--muted); font-size: 12px; }
  .msg { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
  .msg.user { flex-direction: row-reverse; }
  img.avatar { object-fit: cover; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #4a3b5c, #1d1a26);
  }
  .content { display: flex; flex-direction: column; gap: 6px; max-width: 78%; min-width: 0; }
  .msg.user .content { align-items: flex-end; }
  .name { font-size: 13px; color: var(--muted); }
  .bubble {
    background: var(--bubble); border-radius: 18px; padding: 12px 16px;
    line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: var(--user-bubble); }
  .bubble em { color: var(--muted); font-style: italic; }
  .bubble p { margin: 0; }
  .bubble p + p { margin-top: 10px; }
  .bubble .say { color: var(--text); border-left: 2px solid var(--accent); padding-left: 10px; }
  .bubble .nar { color: var(--muted); }
  .choices { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .chip {
    background: none; color: var(--text);
    border: 1px solid var(--accent); border-radius: 999px;
    padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer;
    text-align: left; max-width: 100%;
  }
  .chip:hover { background: var(--user-bubble); }
  .chip:disabled { opacity: 0.4; cursor: default; }
  .status { font-size: 13px; color: var(--muted); font-style: italic; }
  form.input-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px; border-top: 1px solid var(--border);
  }
  .input {
    flex: 1; min-width: 0; background: var(--bubble); border: 0;
    border-radius: 24px; padding: 12px 16px; color: var(--text);
    font: inherit; font-size: 15px;
  }
  .input::placeholder { color: var(--muted); }
  .send {
    width: 46px; height: 46px; border-radius: 50%; border: 0;
    background: var(--accent); color: #fff; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .send:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <button type="button" aria-label="Quay lại">&#8249;</button>
    <span class="title">Lost love</span>
    <span class="pill">zeta</span>
    <button type="button" id="reset" aria-label="Làm mới chat">&#8635;</button>
  </header>

  <main class="messages" id="messages" aria-live="polite">
    <div class="notice">Tất cả phản hồi đều do AI tạo ra</div>
  </main>

  <form class="input-bar" id="form">
    <input class="input" id="text" type="text" placeholder="Enter text" autocomplete="off" aria-label="Nhập tin nhắn">
    <button class="send" id="send" type="submit" aria-label="Gửi" disabled>&#9654;</button>
  </form>
</div>

<script>
  const OPENING = "Một năm đã trôi qua kể từ khi mọi chuyện kết thúc giữa Eve và Guest. Ray kéo bạn đến quán bar này trong buổi tụ tập của bạn bè, và bạn chỉ đi vì cậu ấy cứ nói mãi không thôi.";
  const OPENING_2 = "Bên kia phòng, một cô gái điềm tĩnh với mái tóc bạc trắng dài đang ngồi cạnh một người bạn tóc hồng. Trong thoáng chốc, đôi mắt vàng của cô ấy chạm vào mắt bạn. Rồi cô ấy quay đi.";
  const OPENING_SPEECH = "Một người đàn ông to con, dáng như cầu thủ bóng bầu dục, ngồi xuống cạnh cô ấy và hôn lên má cô. Anh ta nhìn bạn như đang đánh giá.";

  const messagesEl = document.getElementById('messages');
  const form = document.getElementById('form');
  const input = document.getElementById('text');
  const sendBtn = document.getElementById('send');
  const resetBtn = document.getElementById('reset');

  // Chat history sent to the server, in Claude's message format.
  let history = [];
  let busy = false;

  function esc(s) {
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // *italic* marks narration. Quoted text is dialogue and gets its own line.
  function narrationHTML(s) {
    return s.split(/\*([^*]+)\*/).map((part, i) => i % 2 ? '<em>' + esc(part) + '</em>' : esc(part)).join('');
  }

  // Avatars for named characters. Others get the default circle.
  const AVATARS = { Eve: 'avatars/eve.png', Lily: 'avatars/lily.png' };

  function avatarHTML(name) {
    return AVATARS[name]
      ? '<img class="avatar" src="' + AVATARS[name] + '" alt="' + esc(name) + '">'
      : '<div class="avatar"></div>';
  }

  // Each paragraph becomes its own message: a named line gets that character's avatar and name,
  // and narration (no name in front) is a plain bubble.
  function renderBotTurn(text) {
    text.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).forEach(p => {
      const m = p.match(/^([\p{L}]+(?: [\p{L}]+)?):\s*([\s\S]*)$/u);
      if (m && /^["“]/.test(m[2])) {
        const wrap = document.createElement('div');
        wrap.className = 'msg bot';
        wrap.innerHTML = avatarHTML(m[1]) + '<div class="content"><div class="name">' + esc(m[1]) + '</div><div class="bubble say">' + esc(m[2]) + '</div></div>';
        messagesEl.appendChild(wrap);
      } else {
        const wrap = document.createElement('div');
        wrap.className = 'msg bot narr';
        wrap.innerHTML = '<div class="content"><div class="bubble">' + narrationHTML(p) + '</div></div>';
        messagesEl.appendChild(wrap);
      }
    });
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(role, html, name) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const avatar = role === 'user' ? '' : '<div class="avatar"></div>';
    const label = name ? '<div class="name">' + esc(name) + '</div>' : '';
    wrap.innerHTML = avatar + '<div class="content">' + label + '<div class="bubble">' + html + '</div></div>';
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  // Splits a model reply into the story text and "- option" lines.
  function parseReply(text) {
    const lines = text.split('\n');
    const options = [];
    const story = [];
    for (const line of lines) {
      const m = line.match(/^\s*-\s+(.+)$/);
      if (m) options.push(m[1].trim());
      else story.push(line);
    }
    return { story: story.join('\n').trim(), options };
  }

  function showOptions(options) {
    document.querySelectorAll('.choices').forEach(n => n.remove());
    if (!options.length) return;
    const box = document.createElement('div');
    box.className = 'choices';
    options.forEach(label => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip';
      btn.textContent = label;
      btn.addEventListener('click', () => sendTurn(label));
      box.appendChild(btn);
    });
    messagesEl.appendChild(box);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setBusy(on) {
    busy = on;
    updateSendState();
    document.querySelectorAll('.chip').forEach(b => b.disabled = on);
  }

  function updateSendState() {
    sendBtn.disabled = busy || input.value.trim() === '';
  }

  // Asks the server for the next beat. `userText` is optional: with no text, the story just continues.
  async function sendTurn(userText) {
    if (busy) return;
    document.querySelectorAll('.choices').forEach(n => n.remove());
    if (userText) {
      addMessage('user', esc(userText));
      history.push({ role: 'user', content: userText });
    } else {
      history.push({ role: 'user', content: '(The reader is waiting. Continue the story.)' });
    }

    const status = addMessage('bot', '<span class="status">...</span>', 'Lost love');
    setBusy(true);
    try {
      const res = await fetch('/api/next', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ history })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Lỗi không xác định');
      status.remove();
      const parsed = parseReply(data.text);
      history.push({ role: 'assistant', content: data.text });
      renderBotTurn(parsed.story);
      // Always offer "let AI continue" so the reader can skip typing after any turn.
      showOptions(parsed.options.concat(['Để AI viết tiếp']));
    } catch (err) {
      status.querySelector('.bubble').innerHTML = '<span class="status">' + esc(err.message) + '</span>';
      // Drop the unanswered turn so the next try starts clean.
      history.pop();
    } finally {
      setBusy(false);
      save();
    }
  }

  input.addEventListener('input', updateSendState);

  form.addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = '';
    updateSendState();
    sendTurn(text);
  });

  // The chat is saved in this browser so it survives closing the tab. Each device keeps its own copy.
  const STORE_KEY = 'chatchit-history';
  const PLACEHOLDER = '(The reader is waiting. Continue the story.)';
  const DEFAULT_OPTIONS = ['Đi về phía Eve', 'Ngồi vào bàn chơi bài', 'Để AI viết tiếp'];

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(history)); } catch (e) { /* storage may be blocked */ }
  }

  function loadSaved() {
    try {
      const v = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
      return Array.isArray(v) ? v : [];
    } catch (e) {
      return [];
    }
  }

  function openingText() {
    return '*' + OPENING + '*\n\n*' + OPENING_2 + '*\n\n' + OPENING_SPEECH;
  }

  function startChat() {
    messagesEl.querySelectorAll('.msg, .choices').forEach(n => n.remove());
    history = [{ role: 'assistant', content: openingText() }];
    renderBotTurn(openingText());
    showOptions(DEFAULT_OPTIONS);
    save();
  }

  // Rebuilds the screen from the saved history, without calling the AI again.
  function restoreChat(saved) {
    messagesEl.querySelectorAll('.msg, .choices').forEach(n => n.remove());
    history = saved;
    saved.forEach(m => {
      if (m.role === 'user') {
        if (m.content !== PLACEHOLDER) addMessage('user', esc(m.content));
      } else {
        renderBotTurn(parseReply(m.content).story);
      }
    });
    const last = saved[saved.length - 1];
    if (last && last.role === 'assistant') {
      showOptions(parseReply(last.content).options.concat(['Để AI viết tiếp']));
    } else {
      showOptions(['Để AI viết tiếp']);
    }
  }

  resetBtn.addEventListener('click', () => {
    try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
    startChat();
  });

  // The last option is a special case: it just asks the model to continue without a typed line.
  document.addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (btn && btn.textContent === 'Để AI viết tiếp') {
      e.stopImmediatePropagation();
      e.preventDefault();
      sendTurn(null);
    }
  }, true);

  const saved = loadSaved();
  if (saved.length) restoreChat(saved); else startChat();
  updateSendState();
</script>
</body>
</html>
